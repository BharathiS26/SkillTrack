<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillTrack - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #14213d;
      --paper: #f7f8fb;
      --card: #ffffff;
      --line: #d9deea;
      --muted: #5b6478;
      --accent: #1f5eff;
      --accent-dark: #1648c9;
      --good: #2bb673;
      --mid: #e9a100;
      --low: #d64545;
      --error: #c62828;
      --error-bg: #fdecec;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Figtree", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      background: var(--ink);
      color: #fff;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
    }
    .who { display: flex; align-items: center; gap: 18px; font-size: 0.92rem; color: #c9d2ea; }
    .who a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border: 1.5px solid rgba(255,255,255,0.35);
      padding: 7px 14px;
      border-radius: 8px;
    }
    .who a:hover { background: rgba(255,255,255,0.1); }
    .who a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 36px 24px 64px;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 28px;
      align-items: start;
    }
    h1 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      grid-column: 1 / -1;
    }
    h1 + p { grid-column: 1 / -1; color: var(--muted); margin-top: -18px; }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 26px;
    }
    .panel h2 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.15rem;
      margin-bottom: 18px;
    }
    fieldset { border: none; margin-bottom: 22px; }
    legend { font-weight: 600; margin-bottom: 10px; font-size: 0.95rem; }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .row.two { grid-template-columns: repeat(2, 1fr); }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; }
    input {
      width: 100%;
      font: inherit;
      padding: 10px 12px;
      border: 1.5px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(31, 94, 255, 0.15);
    }
    button.calc {
      width: 100%;
      font: inherit;
      font-weight: 600;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.calc:hover { background: var(--accent-dark); }
    button.calc:focus-visible { outline: 3px solid rgba(31, 94, 255, 0.4); outline-offset: 2px; }
    button.calc:disabled { opacity: .7; cursor: wait; }

    /* Result */
    .score-wrap { text-align: center; padding: 8px 0 20px; }
    .score {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 4.2rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .score small { font-size: 1.3rem; color: var(--muted); font-weight: 600; }
    .label { margin-top: 6px; font-weight: 600; }
    .bar {
      height: 10px;
      background: #e8ecf5;
      border-radius: 99px;
      overflow: hidden;
      margin: 16px 0 4px;
    }
    .bar > div {
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: var(--low);
      transition: width .7s cubic-bezier(.2,.7,.2,1), background .3s;
    }
    .empty { color: var(--muted); line-height: 1.5; }
    #gaps { list-style: none; }
    #gaps li {
      padding: 12px 14px;
      border-left: 4px solid var(--mid);
      background: #fff8e6;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 0.94rem;
      line-height: 1.45;
    }
    #gaps li.ok { border-color: var(--good); background: #eaf8f1; }
    .error {
      display: none;
      background: var(--error-bg);
      color: var(--error);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.92rem;
      margin-bottom: 16px;
    }
    .error.show { display: block; }
    h3 { font-size: 0.95rem; margin: 22px 0 10px; }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr 1fr; }
      header { padding: 14px 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar > div { transition: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">SkillTrack</div>
    <div class="who">
      <span>{{ reg_no }}</span>
      <a href="/logout">Log out</a>
    </div>
  </header>

  <main>
    <h1>Your placement readiness</h1>
    <p>Enter your numbers, then calculate your score.</p>

    <section class="panel">
      <h2>Your profile</h2>
      <form id="profileForm" novalidate>
        <fieldset>
          <legend>Certifications</legend>
          <div class="row two">
            <div><label for="techCerts">Technical</label><input id="techCerts" type="number" min="0" value="0"></div>
            <div><label for="softCerts">Soft skills</label><input id="softCerts" type="number" min="0" value="0"></div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Projects</legend>
          <div class="row">
            <div><label for="easyProjects">Easy</label><input id="easyProjects" type="number" min="0" value="0"></div>
            <div><label for="mediumProjects">Medium</label><input id="mediumProjects" type="number" min="0" value="0"></div>
            <div><label for="hardProjects">Hard</label><input id="hardProjects" type="number" min="0" value="0"></div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Coding practice</legend>
          <div class="row">
            <div><label for="leetcode">LeetCode solved</label><input id="leetcode" type="number" min="0" value="0"></div>
            <div><label for="gfg">GFG solved</label><input id="gfg" type="number" min="0" value="0"></div>
            <div><label for="hackerrank">HackerRank stars</label><input id="hackerrank" type="number" min="0" value="0"></div>
          </div>
        </fieldset>

        <button type="submit" class="calc" id="calcBtn">Calculate score</button>
      </form>
    </section>

    <section class="panel" aria-live="polite">
      <h2>Result</h2>
      <div id="error" class="error" role="alert"></div>

      <div id="empty" class="empty">Your score and the areas to improve will show here.</div>

      <div id="result" hidden>
        <div class="score-wrap">
          <div class="score"><span id="scoreNum">0</span><small> / 100</small></div>
          <div class="label" id="scoreLabel"></div>
          <div class="bar"><div id="scoreBar"></div></div>
        </div>
        <h3>What to fix</h3>
        <ul id="gaps"></ul>
      </div>
    </section>
  </main>

  <script>
    const ids = ["techCerts","softCerts","easyProjects","mediumProjects","hardProjects","leetcode","gfg","hackerrank"];
    const form = document.getElementById("profileForm");
    const btn = document.getElementById("calcBtn");
    const errorBox = document.getElementById("error");
    const emptyBox = document.getElementById("empty");
    const resultBox = document.getElementById("result");

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add("show");
    }

    function verdict(score) {
      if (score >= 75) return { text: "Strong profile", color: "var(--good)" };
      if (score >= 45) return { text: "Getting there", color: "var(--mid)" };
      return { text: "Needs work", color: "var(--low)" };
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("show");

      // Read and clean values: whole numbers, never negative
      const payload = {};
      ids.forEach(id => {
        const v = parseInt(document.getElementById(id).value, 10);
        payload[id] = Number.isNaN(v) || v < 0 ? 0 : v;
      });

      btn.disabled = true;
      btn.textContent = "Calculating...";

      try {
        const res = await fetch("/calculate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.status === 401) { window.location.href = "/"; return; }

        const out = await res.json();
        if (out.status !== "success") {
          showError(out.message || "Something went wrong.");
        } else {
          render(out.data);
        }
      } catch (err) {
        showError("Cannot reach the server. Check that it is running.");
      }

      btn.disabled = false;
      btn.textContent = "Calculate score";
    });

    function render(data) {
      const score = Number(data.readinessScore);
      const v = verdict(score);

      emptyBox.hidden = true;
      resultBox.hidden = false;

      document.getElementById("scoreNum").textContent = score.toFixed(1);
      document.getElementById("scoreLabel").textContent = v.text;

      const bar = document.getElementById("scoreBar");
      bar.style.background = v.color;
      bar.style.width = Math.min(score, 100) + "%";

      const list = document.getElementById("gaps");
      list.innerHTML = "";
      (data.gaps || []).forEach(g => {
        const li = document.createElement("li");
        li.textContent = g;               // textContent, so no HTML injection
        if (g.startsWith("Profile looks solid")) li.className = "ok";
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
